spring.application.name=wallet

server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.cors.allowed-origins=http://localhost:5173
─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ─────────────────────────────────────────────
# SMTP — Gmail example
# ─────────────────────────────────────────────
# Use an App Password (not your real Gmail password):
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─────────────────────────────────────────────────────────────────────────────
# application.properties — Paystack section
#
# ADD these lines to your existing application.properties.
# For production (AWS EC2 / Docker), set these as environment variables instead
# of hardcoding them here.
# ─────────────────────────────────────────────────────────────────────────────

# ── Paystack ──────────────────────────────────────────────────────────────────
# Get these from: https://dashboard.paystack.com/#/settings/developers

# Your Paystack Secret Key (TEST mode starts with sk_test_)
# NEVER commit the real key to Git. Use env vars in production.
paystack.secret-key=${PAYSTACK_SECRET_KEY:sk_test_0c241358b16a55cda97a82c08cbfe49381e5864f}

# Paystack REST API base URL — do not change unless Paystack updates it
paystack.base-url=https://api.paystack.co

# This is sent inside each transaction to Paystack — must be your frontend
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:5173/payment/paystack/callback}
# Must be whitelisted in Paystack Dashboard → Settings → API Keys & Webhooks → Callback URL
# Local dev:   http://localhost:5173/payment/paystack/callback
# Production:  https://yourdomain.com/payment/paystack/callback


# ─────────────────────────────────────────────────────────────────────────────
# Docker / AWS environment variable equivalents (set in docker-compose.yml
# or EC2 user-data / ECS task definition):
#
#   PAYSTACK_SECRET_KEY=sk_test_xxxxxxxxxxxxxxxxxxxx
#   PAYSTACK_CALLBACK_URL=https://yourdomain.com/payment/paystack/callback
#
# Spring Boot's ${VAR:default} syntax means: use the env var if set,
# otherwise fall back to the default value shown above.
# ─────────────────────────────────────────────────────────────────────────────