spring.application.name=wallet

server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.cors.allowed-origins=http://localhost:5173
─────────────────────────────────────────────
# JWT
─────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ─────────────────────────────────────────────
# SMTP — Gmail example
# ─────────────────────────────────────────────
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

paystack.secret-key=${PAYSTACK_SECRET_KEY}

paystack.base-url=https://api.paystack.co

paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:5173/payment/paystack/callback}

frontend.url=${FRONTEND_URL:http://localhost:5173}

# ─────────────────────────────────────────────────────────────────────────────
